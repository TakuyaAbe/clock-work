<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>New Tab</title>
<link rel="icon" href="icons/icon32.png">
<meta name="description" content="A live clock whose digits are assembled, dropped, flipped and swept away by many small sprung tiles.">
<style>
:root{--bg:#f0eee9;--ink:#151515;--accent:#ff4a1c;--mute:rgba(21,21,21,.42);--gx0:24px;--gx1:24px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.ui{position:fixed;font:500 10px/1.55 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);user-select:none;-webkit-user-select:none;pointer-events:none}
.ui .m,.ui.m{color:var(--mute)}
.tr{top:max(20px,env(safe-area-inset-top));right:max(var(--gx1),env(safe-area-inset-right));text-align:right}
.bl{bottom:max(12px,env(safe-area-inset-bottom));left:calc(max(var(--gx0),env(safe-area-inset-left)) - 6px);pointer-events:auto}
#snd{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:6px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--mute);transition:color .3s}
#snd:hover,#snd:focus-visible{color:var(--ink)}
#snd:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
#snd i{display:inline-block;width:7px;height:7px;border:1px solid currentColor;transition:background .3s,border-color .3s}
#snd.on{color:var(--ink)}
#snd.on i{background:var(--ink);border-color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:600px){.hide-s{display:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="ui tr"><span id="date">&nbsp;</span><br><span class="m" id="tz">&nbsp;</span></div>
<div class="ui bl"><button id="snd" type="button" aria-pressed="false"><i></i><span>Sound off</span></button></div>
<div class="sr" role="status" aria-live="polite" aria-atomic="true" id="sr"></div>
<script src="newtab.js"></script>
</body>
</html>
