<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>New Tab</title>
<link rel="icon" href="icons/icon32.png">
<style>
:root{--wall:#bdb5aa;--ink:rgba(70,62,52,.6)}
html,body{margin:0;height:100%;background:var(--wall);overflow:hidden}
body{-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
/* the playground (debug bar) toggle: a faint ring in the corner */
#pg{position:fixed;right:12px;bottom:23px;width:32px;height:32px;padding:0;border:0;border-radius:50%;background:transparent;
  cursor:pointer;opacity:.3;transition:opacity .4s;z-index:11;-webkit-tap-highlight-color:transparent}
#pg::after{content:"";position:absolute;inset:0;margin:auto;width:11px;height:11px;box-sizing:border-box;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(40,34,28,.16)}
#pg:hover,#pg[aria-expanded="true"]{opacity:.8}
#pg:focus-visible{opacity:.9;outline:2px solid rgba(255,255,255,.85);outline-offset:-2px}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label=""></canvas>
<button id="pg" type="button" aria-label="playground" aria-controls="kc-dbg" aria-expanded="false"></button>
<script src="newtab.js"></script>
</body>
</html>
